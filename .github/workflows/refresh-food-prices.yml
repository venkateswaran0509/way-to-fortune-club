name: Refresh Tamil Nadu retail food prices

on:
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-food-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch and calculate weekly Tamil Nadu averages
        run: python scripts/refresh_food_prices.py
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/food-prices.json; then
            echo "No price data changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/food-prices.json
          git commit -m "Refresh Tamil Nadu retail food prices"
          git push


